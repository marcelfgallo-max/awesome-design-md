<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="1320" viewBox="0 0 570 965" role="img" aria-labelledby="title desc">
  <title id="title">Simulação do design system MG Works em uma tela de celular</title>
  <desc id="desc">Tela estreita com navegação móvel, cabeçalho preto, assinatura MG Works, título grande, texto de apoio e início da página de identidade.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FA5002"/>
      <stop offset=".54" stop-color="#CACBD2"/>
      <stop offset="1" stop-color="#A3D6F4"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".17" stroke-width="1"/>
    </pattern>
    <clipPath id="screenClip"><rect x="90" y="75" width="390" height="844" rx="32"/></clipPath>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="570" height="965" fill="#E9E9E6"/>
  <text x="285" y="34" fill="#62666B" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1.4">PRÉVIA MOBILE / VIEWPORT 390 PX</text>
  <rect x="76" y="60" width="418" height="874" rx="48" fill="#161616" filter="url(#phoneShadow)"/>
  <g clip-path="url(#screenClip)" font-family="Archivo, Arial, sans-serif">
    <rect x="90" y="75" width="390" height="844" fill="#F4F4F2"/>

    <!-- Status bar -->
    <rect x="90" y="75" width="390" height="24" fill="#000"/>
    <text x="111" y="92" fill="#fff" font-size="11" font-weight="600">9:41</text>
    <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M431 88h2m3-3v3m3-6v6m3-8v8"/>
      <rect x="448" y="82" width="16" height="9" rx="2"/>
      <path d="M465 85v3"/>
      <rect x="450" y="84" width="11" height="5" rx="1" fill="#fff" stroke="none"/>
    </g>

    <!-- Compact mobile rail -->
    <rect x="90" y="99" width="390" height="86" fill="#000"/>
    <image x="108" y="106" width="126" height="27" preserveAspectRatio="xMinYMid meet" xlink:href="data:image/svg+xml;base64,"/>
    <g font-size="11" font-weight="500" text-anchor="middle">
      <rect x="101" y="143" width="49" height="31" fill="#191919"/>
      <rect x="101" y="172" width="49" height="2" fill="#FA5002"/>
      <text x="125.5" y="163" fill="#fff">Início</text>
      <text x="193" y="163" fill="#C7C7C7">Identidade</text>
      <text x="263" y="163" fill="#C7C7C7">Cor</text>
      <text x="316" y="163" fill="#C7C7C7">Tipo</text>
      <text x="398" y="163" fill="#C7C7C7">Composição</text>
    </g>

    <!-- Document bar -->
    <rect x="90" y="185" width="390" height="49" fill="#fff"/>
    <path d="M90 233.5H480" stroke="#E6E7E9"/>
    <text x="108" y="215" fill="#111" font-size="11" font-weight="600">Design System</text>
    <text x="191" y="215" fill="#858A90" font-size="11">/ Fundamentos</text>
    <rect x="340" y="198" width="126" height="25" rx="13" fill="#fff" stroke="#CACBD2"/>
    <circle cx="352" cy="210.5" r="3.3" fill="#FA5002"/>
    <text x="361" y="214" fill="#252424" font-family="'IBM Plex Mono', monospace" font-size="8">V1.0.0 · RASCUNHO</text>

    <!-- Hero -->
    <rect x="90" y="234" width="390" height="642" fill="#000"/>
    <rect x="325" y="234" width="155" height="4" fill="url(#signal)"/>
    <rect x="350" y="268" width="130" height="280" fill="url(#grid)" opacity=".72"/>
    <rect x="325" y="268" width="155" height="280" fill="url(#gridFade)"/>
    <rect x="110" y="268" width="20" height="2" fill="#FA5002"/>
    <text x="138" y="273" fill="#BDBDBD" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".4">MG WORKS / DESIGN SYSTEM / 2026</text>
    <image x="110" y="342" width="203" height="38" preserveAspectRatio="xMinYMid meet" xlink:href="data:image/svg+xml;base64,"/>
    <text x="110" y="481" fill="#FFFFFF" font-size="48" font-weight="500" letter-spacing="-2.7">Visão que</text>
    <text x="110" y="528" fill="#FFFFFF" font-size="48" font-weight="500" letter-spacing="-2.7">conecta.</text>
    <text x="110" y="575" fill="#AAAAAA" font-size="48" font-weight="500" letter-spacing="-2.7">Trabalho que</text>
    <text x="110" y="622" fill="#AAAAAA" font-size="48" font-weight="500" letter-spacing="-2.7">avança.</text>
    <text x="110" y="686" fill="#C4C4C4" font-size="16">Uma linguagem clara para identidade,</text>
    <text x="110" y="710" fill="#C4C4C4" font-size="16">comunicação e produtos digitais. Estrutura</text>
    <text x="110" y="734" fill="#C4C4C4" font-size="16">suficiente para dar consistência, espaço</text>
    <text x="110" y="758" fill="#C4C4C4" font-size="16">suficiente para cada projeto ter contexto.</text>
    <rect x="110" y="790" width="198" height="34" fill="none" stroke="#4A4A4A"/>
    <text x="123" y="811" fill="#FA5002" font-family="'IBM Plex Mono', monospace" font-size="10">01</text>
    <text x="146" y="811" fill="#DEDEDE" font-family="'IBM Plex Mono', monospace" font-size="10">/ SISTEMA COMPARTILHADO</text>

    <!-- First content section below the fold -->
    <rect x="90" y="876" width="390" height="43" fill="#fff"/>
    <text x="110" y="914" fill="#62666B" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing=".5">COMO USAR</text>
    <path d="M90 918H480" stroke="#CACBD2"/>
  </g>
  <rect x="90" y="75" width="390" height="844" rx="32" fill="none" stroke="#2C2C2C" stroke-width="1"/>

  <text x="285" y="956" fill="#62666B" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing=".5">SIMULAÇÃO ESTÁTICA BASEADA NO INDEX.HTML RESPONSIVO</text>
</svg>
